plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mixauthlogin'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.qileys"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
        // QQ互联官方凭据（AppID 102064194，APP_KEY 已按用户提供值内置）
        buildConfigField 'String', 'QQ_APP_ID', '"102064194"'
        buildConfigField 'String', 'QQ_APP_KEY', '"RtKbhdNxMacT8bv5"'
        buildConfigField 'String', 'QQ_REDIRECT_URI', '"tencent102064194://auth.qq.com/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file('../qileys.keystore')
            storePassword 'android123'
            keyAlias 'qileys'
            keyPassword 'android123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // QQ互联官方 SDK：支持直接调起手机 QQ 客户端完成授权（SSO 一键登录）
    // 未安装手机 QQ 或环境不支持时，代码会回退到内置 WebView 授权页流程
    implementation 'com.tencent.tauth:qq-open-sdk:3.53.0'
}