plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mixauthlogin'
    compileSdk 34

    defaultConfig {
        // ⚠️ 必须与 connect.qq.com 后台登记的包名完全一致
        applicationId "com.android.qileys"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"

        // ===== QQ互联凭据 =====
        // AppID 会写进 AndroidManifest 的 scheme（tencent102064194），改这里必须同步改 Manifest
        buildConfigField 'String', 'QQ_APP_ID', '"102064194"'
        // APP_KEY 只用于 code 换 token 的 Web 流程；
        // 官方 SDK 的 SSO 登录不需要它。生产环境请把它移到自己的服务端，不要放进 APK。
        buildConfigField 'String', 'QQ_APP_KEY', '"RtKbhdNxMacT8bv5"'
        buildConfigField 'String', 'QQ_REDIRECT_URI', '"tencent102064194://auth.qq.com/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ===== 签名 =====
    // QQ 官方 SDK 会校验「包名 + 签名 MD5」，所以必须用固定 keystore 签名（不能用随机的 debug key）
    signingConfigs {
        release {
            storeFile file('../qileys.keystore')
            storePassword 'android123'
            keyAlias 'qileys'
            keyPassword 'android123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // 同样用固定 keystore，保证 CI 产出的 APK 签名 MD5 稳定、可直接去 QQ互联登记
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // 腾讯 QQ 互联官方 Android SDK 3.5.19（3.5.12 之后官方不再提供 Maven 依赖，只能本地 jar）
    implementation files('libs/open_sdk_3.5.19_r9483ffc7_lite.jar')

    // ⚠️ SDK 内部仍引用 android.support.v4.content.FileProvider（旧的 support 库）。
    // 本工程 android.useAndroidX=true，所以必须把老 support-v4 也加进来，
    // 否则运行时 NoClassDefFoundError。
    implementation 'com.android.support:support-v4:28.0.0'
}

// 纯 Java 实现（org.json 为 Android 系统内置）
