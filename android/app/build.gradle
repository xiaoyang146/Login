plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mixauthlogin'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mixauthlogin"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 纯 Java 实现，零第三方依赖（org.json 为 Android 系统内置）