name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Ensure QQ OpenSDK jar
        run: bash scripts/fetch-qopensdk.sh

      - name: Build APK (debug + release, 固定 keystore 签名)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Print APK signing certificate (用于填 QQ互联后台的签名 MD5)
        run: |
          set -e
          for APK in android/app/build/outputs/apk/debug/app-debug.apk \
                     android/app/build/outputs/apk/release/app-release.apk; do
            [ -f "$APK" ] || continue
            echo "=================================================="
            echo "APK: $APK"
            keytool -printcert -jarfile "$APK" || true
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: qq-login-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
