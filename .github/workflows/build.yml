name: Build JAR

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and package
        run: bash build.sh

      - name: Smoke test (headless, no real scan)
        run: |
          timeout 30 java -jar mixauth-login.jar qq --no-gui --timeout=8 --interval=2000 || true
          ls -la mixauth-login.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mixauth-login-jar
          path: mixauth-login.jar
